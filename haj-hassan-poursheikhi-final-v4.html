<title>کالای خواب حاج حسن پورشیخی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Noto+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --ink: #262a2f;
    --linen: #ede7db;
    --linen-2: #e4dccb;
    --navy: #202b42;
    --navy-2: #16203a;
    --clay: #b9866c;
    --clay-deep: #a06f57;
    --sage: #7c8b6f;
    --line: rgba(32,43,66,0.14);
    --card-bg: #f5f1e8;
    --danger: #a55b4f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #ece7dd; --linen: #141b2c; --linen-2: #1a2337;
      --navy: #0f1526; --navy-2: #0a0f1c; --clay: #cf9a80; --clay-deep: #dcae95;
      --sage: #9fae91; --line: rgba(236,231,221,0.14); --card-bg: #182036; --danger: #e29187;
    }
  }
  :root[data-theme="dark"] {
    --ink: #ece7dd; --linen: #141b2c; --linen-2: #1a2337;
    --navy: #0f1526; --navy-2: #0a0f1c; --clay: #cf9a80; --clay-deep: #dcae95;
    --sage: #9fae91; --line: rgba(236,231,221,0.14); --card-bg: #182036; --danger: #e29187;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--linen);
    color: var(--ink);
    font-family: 'Vazirmatn', sans-serif;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display { font-family: 'Noto Serif', serif; font-weight: 600; }
  img, svg { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; top: env(safe-area-inset-top, 0px);
    z-index: 20; background: var(--linen); border-bottom: 1px solid var(--line);
  }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo-box {
    width: 46px; height: 46px; border-radius: 14px; background: var(--navy);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    flex-shrink: 0; position: relative;
  }
  .logo-box img { width: 100%; height: 100%; object-fit: contain; }
  .logo-box .placeholder { color: var(--clay); font-size: 20px; }
  .brand-name { font-family: 'Noto Serif', serif; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .call-btn {
    display: flex; align-items: center; gap: 8px; background: var(--clay-deep); color: #fff;
    border: none; border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 500; white-space: nowrap;
  }
  .call-btn svg { width: 16px; height: 16px; }

  /* ---------- Edit toggle (floating) ---------- */
  .edit-toggle {
    position: fixed; left: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    z-index: 40; background: var(--navy); color: #f3efe4; border: none; border-radius: 999px;
    padding: 12px 20px; font-size: 13.5px; display: none; align-items: center; gap: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }
  .edit-toggle.show { display: flex; }
  .save-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: var(--navy); color: #f3efe4; padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
    display: none; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }
  .save-bar.show { display: flex; }
  .save-bar span { font-size: 13px; opacity: 0.8; }
  .save-bar .actions { display: flex; gap: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 999px; font-size: 14px; font-weight: 500; border: 1px solid transparent; }
  .btn-primary { background: var(--clay-deep); color: #fff; }
  .btn-ghost { background: transparent; border-color: rgba(243,239,228,0.35); color: #f3efe4; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Editable field styling ---------- */
  .editable-input {
    background: var(--card-bg); border: 1px dashed var(--clay-deep); border-radius: 8px;
    padding: 6px 10px; font-size: inherit; color: inherit; width: 100%;
  }

  /* ---------- Hero ---------- */
  .hero { padding: 48px 0 40px; text-align: center; }
  .hero h1 { font-size: clamp(26px, 4vw, 36px); }
  .hero p { margin-top: 14px; font-size: 15.5px; opacity: 0.75; max-width: 52ch; margin-inline: auto; }
  .hero .edit-hero-field { max-width: 560px; margin: 10px auto 0; }

  /* ---------- Section head ---------- */
  .section-head { text-align: center; margin-bottom: 30px; }
  .section-head h2 { font-size: 24px; }
  .section-head p { font-size: 14px; opacity: 0.65; margin-top: 8px; }

  /* ---------- Products ---------- */
  .products { padding: 10px 0 64px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 860px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .product { background: var(--card-bg); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .product .thumb { aspect-ratio: 4/3.1; background: var(--linen-2); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .product .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .product .thumb .ph-icon { color: var(--clay); width: 44px; height: 44px; }
  .product .info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .product h3 { font-family: 'Vazirmatn', sans-serif; font-weight: 600; font-size: 15px; }
  .price { font-weight: 700; font-size: 15px; color: var(--clay-deep); }
  .product-edit-controls { display: flex; gap: 8px; position: absolute; top: 8px; left: 8px; z-index: 5; }
  .icon-btn { width: 30px; height: 30px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.9); }
  .icon-btn svg { width: 15px; height: 15px; color: var(--ink); }
  .icon-btn.danger svg { color: var(--danger); }
  .upload-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(32,43,66,0.35); color: #fff; font-size: 12px; opacity: 0; transition: opacity .15s; cursor: pointer; }
  .thumb:hover .upload-label, .thumb.editing .upload-label { opacity: 1; }
  .product .info input.editable-input { font-size: 14px; padding: 7px 10px; }
  .product .info input.price-input { max-width: 140px; }

  .add-card { border: 2px dashed var(--line); border-radius: 16px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 30px; min-height: 180px; color: var(--sage); background: transparent; }
  .add-card.show { display: flex; }
  .add-card svg { width: 30px; height: 30px; }

  .empty-state { text-align: center; padding: 30px 10px; opacity: 0.6; font-size: 14.5px; }

  /* ---------- Contact ---------- */
  .contact { background: var(--navy); color: #f3efe4; padding: 48px 0; }
  .contact .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  @media (max-width: 720px) { .contact .wrap { grid-template-columns: 1fr; } }
  .contact-item { display: flex; gap: 14px; align-items: flex-start; }
  .contact-item .icon { width: 24px; height: 24px; flex-shrink: 0; color: var(--clay); margin-top: 3px; }
  .contact-item h4 { font-size: 14.5px; margin-bottom: 5px; opacity: 0.9; }
  .contact-item p, .contact-item a { font-size: 15px; opacity: 0.85; }
  .contact-item input.editable-input { color: #fff; background: rgba(255,255,255,0.08); border-color: rgba(243,239,228,0.4); }

  /* ---------- Footer ---------- */
  footer { padding: 26px 0 calc(26px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 12.5px; opacity: 0.55; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); right: 50%; transform: translate(50%, 20px);
    background: var(--navy); color: #f3efe4; padding: 13px 22px; border-radius: 999px; font-size: 13.5px;
    opacity: 0; transition: opacity .25s ease, transform .25s ease; pointer-events: none; z-index: 60; white-space: nowrap; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translate(50%, 0); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
(function(){
  "use strict";

  // Capture the pristine document FIRST, before any rendering/mutation happens.
  var PRISTINE_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

  var state = JSON.parse(document.getElementById('state-data').textContent);
  var editMode = false;
  var canEdit = false;
  var artifactApi = null;

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  function toPersianDigits(str){
    var map = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
    return String(str).replace(/[0-9]/g, function(d){ return map[d]; });
  }
  function formatPrice(p){
    var n = parseInt(p, 10);
    if (isNaN(n)) return '';
    var withCommas = n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return toPersianDigits(withCommas) + ' تومان';
  }

  function svgPlaceholder(){
    return '<svg class="ph-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="8.5" cy="12" r="1.6"/><path d="M21 16l-4.2-4.2a1.5 1.5 0 0 0-2.1 0L9 17"/></svg>';
  }
  function svgEdit(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  }
  function svgTrash(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';
  }

  function renderStatic(){
    document.getElementById('brandNameDisplay').textContent = state.shopName;
    document.getElementById('brandNameHero').textContent = state.shopName;
    document.getElementById('introDisplay').textContent = state.intro;
    document.getElementById('introInput').value = state.intro;
    document.getElementById('addressDisplay').textContent = state.address;
    document.getElementById('addressInput').value = state.address;
    document.getElementById('phoneDisplay').textContent = toPersianDigits(state.phone);
    document.getElementById('phoneDisplay').setAttribute('href', 'tel:' + state.phone);
    document.getElementById('phoneInput').value = state.phone;
    document.getElementById('headerCallText').textContent = 'تماس بگیرید';
    document.getElementById('headerCallBtn').setAttribute('href', 'tel:' + state.phone);
    document.getElementById('footerText').textContent = '© تمامی حقوق برای ' + state.shopName + ' محفوظ است';

    var logoImg = document.getElementById('logoImg');
    var logoPh = document.getElementById('logoPlaceholder');
    if (state.logo) {
      logoImg.src = state.logo;
      logoImg.style.display = 'block';
      logoPh.style.display = 'none';
    } else {
      logoImg.style.display = 'none';
      logoPh.style.display = 'block';
    }
  }

  function renderProducts(){
    var grid = document.getElementById('productsGrid');
    grid.innerHTML = '';
    document.getElementById('emptyState').style.display = (state.products.length === 0 && !editMode) ? 'block' : 'none';

    state.products.forEach(function(p){
      var card = document.createElement('div');
      card.className = 'product';

      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      if (p.photo) {
        var img = document.createElement('img');
        img.src = p.photo;
        thumb.appendChild(img);
      } else {
        thumb.innerHTML = svgPlaceholder();
      }

      if (editMode) {
        var controls = document.createElement('div');
        controls.className = 'product-edit-controls';
        var delBtn = document.createElement('button');
        delBtn.className = 'icon-btn danger';
        delBtn.innerHTML = svgTrash();
        delBtn.title = 'حذف محصول';
        delBtn.addEventListener('click', function(){
          state.products = state.products.filter(function(x){ return x.id !== p.id; });
          renderProducts();
        });
        controls.appendChild(delBtn);
        card.appendChild(controls);

        var uploadLabel = document.createElement('label');
        uploadLabel.className = 'upload-label';
        uploadLabel.textContent = 'تغییر عکس';
        uploadLabel.style.opacity = p.photo ? '' : '1';
        var fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileInput.style.display = 'none';
        fileInput.addEventListener('change', function(e){
          var f = e.target.files[0];
          if (!f) return;
          resizeImage(f, 640, function(dataUrl){
            p.photo = dataUrl;
            renderProducts();
          });
        });
        uploadLabel.appendChild(fileInput);
        thumb.appendChild(uploadLabel);
        thumb.classList.add('editing');
      }

      card.appendChild(thumb);

      var info = document.createElement('div');
      info.className = 'info';

      if (editMode) {
        var nameInput = document.createElement('input');
        nameInput.className = 'editable-input';
        nameInput.type = 'text';
        nameInput.value = p.name;
        nameInput.placeholder = 'نام محصول';
        nameInput.addEventListener('input', function(){ p.name = nameInput.value; });
        info.appendChild(nameInput);

        var priceInput = document.createElement('input');
        priceInput.className = 'editable-input price-input';
        priceInput.type = 'text';
        priceInput.inputMode = 'numeric';
        priceInput.value = p.price;
        priceInput.placeholder = 'قیمت (تومان)';
        priceInput.addEventListener('input', function(){ p.price = priceInput.value.replace(/[^0-9]/g,''); });
        info.appendChild(priceInput);
      } else {
        var h3 = document.createElement('h3');
        h3.textContent = p.name || 'بدون‌نام';
        info.appendChild(h3);
        var priceEl = document.createElement('div');
        priceEl.className = 'price';
        priceEl.textContent = formatPrice(p.price) || 'قیمت: تماس بگیرید';
        info.appendChild(priceEl);
      }

      card.appendChild(info);
      grid.appendChild(card);
    });

    var addCard = document.getElementById('addCard');
    if (addCard) addCard.remove();
    if (editMode) {
      var add = document.createElement('button');
      add.className = 'add-card show';
      add.id = 'addCard';
      add.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg><span>افزودن محصول</span>';
      add.addEventListener('click', function(){
        state.products.push({ id: 'p' + Date.now() + Math.floor(Math.random()*1000), name: '', price: '', photo: '' });
        renderProducts();
      });
      grid.appendChild(add);
    }
  }

  function resizeImage(file, maxW, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxW / img.width);
        var w = Math.round(img.width * scale);
        var h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function setEditMode(on){
    editMode = on;
    document.getElementById('saveBar').classList.toggle('show', on);
    document.getElementById('editToggleText').textContent = on ? 'بستن ویرایش' : 'ویرایش سایت';

    document.getElementById('introDisplay').style.display = on ? 'none' : 'block';
    document.getElementById('introEditWrap').style.display = on ? 'block' : 'none';
    document.getElementById('addressDisplay').style.display = on ? 'none' : 'block';
    document.getElementById('addressEditWrap').style.display = on ? 'block' : 'none';
    document.getElementById('phoneDisplay').style.display = on ? 'none' : 'block';
    document.getElementById('phoneEditWrap').style.display = on ? 'block' : 'none';
    document.getElementById('logoUploadLabel').style.display = on ? 'flex' : 'none';

    renderProducts();
  }

  function collectEditedState(){
    state.intro = document.getElementById('introInput').value.trim() || state.intro;
    state.address = document.getElementById('addressInput').value.trim() || state.address;
    state.phone = document.getElementById('phoneInput').value.trim() || state.phone;
    return state;
  }

  function buildPublishHtml(newState){
    var jsonSafe = JSON.stringify(newState).replace(/</g, '\\u003c');
    return PRISTINE_HTML.replace(
      /<script id="state-data" type="application\/json">[\s\S]*?<\/script>/,
      '<script id="state-data" type="application/json">' + jsonSafe + '<\/script>'
    );
  }

  async function initCapabilities(){
    if (!window.claude || !window.claude.use) { return; }
    try {
      var user = await window.claude.use('user');
      if (user && typeof user.canEdit === 'function') {
        var res = user.canEdit();
        canEdit = res && typeof res.then === 'function' ? await res : !!res;
      }
    } catch(e) { canEdit = false; }
    try {
      artifactApi = await window.claude.use('artifact');
    } catch(e) { artifactApi = null; }

    document.getElementById('editToggleBtn').classList.toggle('show', !!canEdit && !!artifactApi);
  }

  document.getElementById('editToggleBtn').addEventListener('click', function(){
    setEditMode(!editMode);
  });
  document.getElementById('cancelEditBtn').addEventListener('click', function(){
    state = JSON.parse(document.getElementById('state-data').textContent);
    setEditMode(false);
    renderStatic();
    renderProducts();
  });
  document.getElementById('saveBtn').addEventListener('click', async function(){
    if (!artifactApi) { toast('امکان ذخیره در دسترس نیست'); return; }
    var btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'در حال انتشار...';
    try {
      var newState = collectEditedState();
      var html = buildPublishHtml(newState);
      await artifactApi.publish(html);
      toast('تغییرات با موفقیت منتشر شد');
      setEditMode(false);
      renderStatic();
      renderProducts();
    } catch(err) {
      toast('انتشار انجام نشد — دوباره تلاش کنید');
    } finally {
      btn.disabled = false;
      btn.textContent = 'ذخیره و انتشار';
    }
  });
  document.getElementById('logoInput').addEventListener('change', function(e){
    var f = e.target.files[0];
    if (!f) return;
    resizeImage(f, 300, function(dataUrl){
      state.logo = dataUrl;
      renderStatic();
    });
  });
  document.getElementById('logoUploadLabel').addEventListener('click', function(e){
    if (e.target.tagName !== 'INPUT') document.getElementById('logoInput').click();
  });

  renderStatic();
  renderProducts();
  initCapabilities();
})();
</script>

</body>
</html>
